<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f1a" />
    <title>Alien Wars Tower Defence</title>
  </head>
  <body>
    <div id="app">
      <header id="hud"></header>
      <main id="stage">
        <canvas id="game"></canvas>
        <div id="overlay" hidden></div>
      </main>
      <section id="panel">
        <div id="context"></div>
        <div id="controls">
          <button id="speed" class="btn btn-speed">1×</button>
          <button id="primary" class="btn btn-primary"></button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
